    <!-- =========================
         MOBILE DRAWER
         ========================= -->

    <script>

        const hamburger =
            document.getElementById('hamburger');

        const drawer =
            document.getElementById('mobile-drawer');

        const overlay =
            document.getElementById('drawerOverlay');

        const drawerClose =
            document.getElementById('drawerClose');


        function openDrawer() {

            drawer.classList.add('open');

            overlay.classList.add('open');

            hamburger.classList.add('active');

            hamburger.setAttribute(
                'aria-expanded',
                'true'
            );

            drawer.setAttribute(
                'aria-hidden',
                'false'
            );

            document.body.style.overflow = 'hidden';

        }


        function closeDrawer() {

            drawer.classList.remove('open');

            overlay.classList.remove('open');

            hamburger.classList.remove('active');

            hamburger.setAttribute(
                'aria-expanded',
                'false'
            );

            drawer.setAttribute(
                'aria-hidden',
                'true'
            );

            document.body.style.overflow = '';

        }


        hamburger.addEventListener(
            'click',
            () => {

                drawer.classList.contains('open')
                    ? closeDrawer()
                    : openDrawer();

            }
        );


        drawerClose.addEventListener(
            'click',
            closeDrawer
        );


        overlay.addEventListener(
            'click',
            closeDrawer
        );

    </script>



    <!-- =========================
         FOOTER SPARKLES
         ========================= -->

    <script>

        const footerSparkleContainer =
            document.querySelector('.footer-sparkles');


        if (footerSparkleContainer) {

            const footerSparkleCount = 20;


            for (
                let i = 0;
                i < footerSparkleCount;
                i++
            ) {

                const sparkle =
                    document.createElement('span');


                sparkle.classList.add(
                    'hero-sparkle'
                );


                const size =
                    Math.random() * 2 + 1.5;

                const x =
                    Math.random() * 100;

                const duration =
                    Math.random() * 8 + 9;

                const delay =
                    Math.random() * -15;

                const drift =
                    Math.random() * 100 - 50;

                const opacity =
                    Math.random() * 0.35 + 0.2;


                sparkle.style.setProperty(
                    '--size',
                    `${size}px`
                );

                sparkle.style.setProperty(
                    '--x',
                    `${x}%`
                );

                sparkle.style.setProperty(
                    '--duration',
                    `${duration}s`
                );

                sparkle.style.setProperty(
                    '--delay',
                    `${delay}s`
                );

                sparkle.style.setProperty(
                    '--drift',
                    `${drift}px`
                );

                sparkle.style.setProperty(
                    '--opacity',
                    opacity
                );


                footerSparkleContainer.appendChild(
                    sparkle
                );

            }

        }

    </script>

    <!-- =========================
         REVEAL ANIMATION
         ========================= -->

    <script>

        const revealEls =
            document.querySelectorAll('.reveal');


        if ('IntersectionObserver' in window) {

            const revealObserver =
                new IntersectionObserver(

                    (entries) => {

                        entries.forEach(
                            (entry, i) => {

                                if (
                                    entry.isIntersecting
                                ) {

                                    entry.target.style.transitionDelay =
                                        (i % 3) * 60 + 'ms';

                                    entry.target.classList.add(
                                        'in-view'
                                    );

                                    revealObserver.unobserve(
                                        entry.target
                                    );

                                }

                            }
                        );

                    },

                    {
                        threshold: 0.12,
                        rootMargin:
                            '0px 0px -60px 0px'
                    }

                );


            revealEls.forEach(
                el =>
                    revealObserver.observe(el)
            );

        }

        else {

            revealEls.forEach(
                el =>
                    el.classList.add('in-view')
            );

        }

    </script>

    <!-- =========================
         SCROLL TO TOP BUTTON
         ========================= -->
    <script>
        const scrollTopButton =
            document.getElementById('scrollTopButton');
    
        const firstSlide =
            document.querySelector('.case-study-slide-wrap');
    
        scrollTopButton.addEventListener('click', () => {
    
            const html = document.documentElement;
    
            const startY = window.scrollY;
    
            const targetY =
                firstSlide.getBoundingClientRect().top
                + window.scrollY
                - 80;
    
            const distance = targetY - startY;
    
            const duration = 1100;
            const startTime = performance.now();
    
            /* Temporarily disable CSS smooth scrolling + snapping */
            const oldScrollBehavior = html.style.scrollBehavior;
            const oldSnapType = html.style.scrollSnapType;
    
            html.style.scrollBehavior = 'auto';
            html.style.scrollSnapType = 'none';
    
    
            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 4);
            }
    
    
            function animate(currentTime) {
    
                const progress =
                    Math.min((currentTime - startTime) / duration, 1);
    
                const eased =
                    easeOutCubic(progress);
    
                window.scrollTo(
                    0,
                    startY + distance * eased
                );
    
    
                if (progress < 1) {
    
                    requestAnimationFrame(animate);
    
                } else {
    
                    window.scrollTo(0, targetY);
    
                    html.style.scrollBehavior = oldScrollBehavior;
                    html.style.scrollSnapType = oldSnapType;
    
                }
    
            }
    
    
            requestAnimationFrame(animate);
    
        });
    </script>
