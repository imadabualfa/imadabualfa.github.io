<!DOCTYPE html>

<body>
  <div class="navbar">
    <div class="logo-hover" onclick="window.location.href='../index.html'">

      <img class="logo logo-yellow" src="../Logo-yellow.svg" alt="">
    </div>

    <div class="nav-links">
      <a href="../index.html" class="H4">Work</a>
      <a href="./index.html" class="H4" aria-current="page">About</a>
      <a href="../snippets/index.html" class="H4">Snippets</a>
    </div>

    <div class="nav-actions">
      <button
        class="theme-toggle"
        type="button"
        aria-label="Switch to light mode"
        aria-pressed="false"
      >
        <span class="theme-moon" aria-hidden="true">☾</span>
        <span class="theme-sun" aria-hidden="true">☀︎</span>
      </button>

      <a
        class="nav-email email-link"
        href="mailto:imad.abualfa.apps@gmail.com"
      >
        imad.abualfa.apps@gmail.com
      </a>

      <button
        class="hamburger"
        id="hamburger"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="mobile-drawer"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <div class="drawer-overlay" id="drawerOverlay"></div>

  <nav class="mobile-drawer" id="mobile-drawer" aria-hidden="true">
    <div class="drawer-header">
      <img class="logo" src="../Logo.svg" alt="Imad Logo">
      <button
        class="drawer-close"
        id="drawerClose"
        aria-label="Close menu"
      >&times;</button>
    </div>

    <div class="drawer-links">
      <a href="../index.html" class="H4">Work</a>
      <a href="./index.html" class="H4">About</a>
      <a href="./index.html" class="H4" aria-current="page">Chess</a>
      <a href="../snippets/index.html" class="H4">Snippets</a>
    </div>

    <a
      class="drawer-email email-link"
      href="mailto:imad.abualfa.apps@gmail.com"
    >
      imad.abualfa.apps@gmail.com
    </a>
  </nav>

  <main class="about-page chess-page">

    <section class="chess-puzzle" aria-label="Chess puzzle">
      <div class="chess-board-column">
        <div id="chess-board" aria-label="Chessboard"></div>
    
        <div class="chess-controls">
          <button class="black-mid" id="puzzle-reset" type="button">
            Try again
          </button>
    
          <button class="light-mid" id="puzzle-solution" type="button">
            Show solution
          </button>
    
          <button
            class="black-mid"
            id="puzzle-next"
            type="button"
            style="display: none"
          >
            Next puzzle
          </button>
        </div>
      </div>
    
      <div class="puzzle-panel">
        <section class="about-intro">
          <p>
            A few positions from my own games. See if you can
            find the moves I played.
          </p>
        </section>

        <p id="puzzle-status" aria-live="polite">
          White to move.
        </p>
    
        <div id="puzzle-result" class="about-intro" hidden>
          <p id="puzzle-explanation"></p>
    
          <a
            id="puzzle-game"
            class="experience-cv"
            target="_blank"
            rel="noopener noreferrer"
          >
            View original game ↗
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span class="footer-name">Imad Al Deen Abu Alfa</span>

    <div class="footer-links">
      <a

      >
        imad.abualfa.apps@gmail.com
      </a>

      <a
        href="https://www.linkedin.com/in/imad-al-deen-abu-alfa/"
        target="_blank"
        rel="noopener noreferrer"
      >
        LinkedIn ↗
      </a>
    </div>
  </footer>

  <script src="../cursor.js"></script>
  <script src="../email-copy.js"></script>

  <script>
    const hamburger = document.getElementById('hamburger');
    const drawer = document.getElementById('mobile-drawer');
    const overlay = document.getElementById('drawerOverlay');
    const drawerClose = document.getElementById('drawerClose');

    function openDrawer() {
      drawer.classList.add('open');
      overlay.classList.add('open');
      hamburger.classList.add('active');
      hamburger.setAttribute('aria-expanded', 'true');
      drawer.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      overlay.classList.remove('open');
      hamburger.classList.remove('active');
      hamburger.setAttribute('aria-expanded', 'false');
      drawer.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    hamburger.addEventListener('click', function () {
      drawer.classList.contains('open')
        ? closeDrawer()
        : openDrawer();
    });

    drawerClose.addEventListener('click', closeDrawer);
    overlay.addEventListener('click', closeDrawer);

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') closeDrawer();
    });

    window.matchMedia('(max-width: 900px)')
      .addEventListener('change', function (event) {
        if (!event.matches) closeDrawer();
      });
  </script>

  <script src="puzzles.js"></script>
  <script src="chess-puzzle.js"></script>
</body>
</html>
